<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Preparación · Automation Engineer</title>
<style>
:root{
  --bg:#f6f6f3;--surface:#fff;--line:#e8e7e2;--line-2:#d8d7d0;
  --text:#191917;--muted:#6b6a64;--faint:#9a9992;
  --accent:#4338ca;--accent-soft:#eef0ff;--on-accent:#fff;
  --ok:#15803d;--ok-soft:#e9f5ed;--warn:#b45309;--warn-soft:#fdf3e4;
  --bad:#b91c1c;--bad-soft:#fdeded;--idle:#77766f;--idle-soft:#efeeea;
  --r:14px;--mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111110;--surface:#1a1a18;--line:#292926;--line-2:#363632;
  --text:#ecebe6;--muted:#a3a29b;--faint:#74736d;
  --accent:#a5b4fc;--accent-soft:#222540;--on-accent:#111110;
  --ok:#4ade80;--ok-soft:#14261a;--warn:#fbbf24;--warn-soft:#2a2113;
  --bad:#f87171;--bad-soft:#2c1717;--idle:#a3a29b;--idle-soft:#23231f;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:28px 24px 48px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:20px}h2{font-size:17px}h3{font-size:15px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
p{margin:0}
code{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}.faint{color:var(--faint)}

.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);position:relative}
.mark:after{content:"";position:absolute;inset:9px;border:2.5px solid var(--on-accent);border-radius:50%;border-right-color:transparent}
.sub{margin-top:2px;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-size:14px;border:1px solid transparent;background:none;color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line-2);color:var(--text);font-weight:500}

.btn{font:inherit;font-size:14px;font-weight:500;border-radius:10px;padding:8px 14px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{font-size:13px;padding:5px 10px;border-radius:8px}

.flash{border-radius:12px;padding:11px 14px;margin:0 0 18px;font-size:14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.flash.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.flash.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}

.section-head{margin-bottom:12px}
.section-head p{margin-top:3px;color:var(--muted);font-size:14px;max-width:760px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card+.card{margin-top:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.empty{color:var(--muted);font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:500;border-radius:999px;padding:1px 8px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}.p-idle{background:var(--idle-soft);color:var(--muted)}
.p-acc{background:var(--accent-soft);color:var(--accent)}

ul.plain{margin:6px 0 0;padding-left:18px}
ul.plain li{margin:3px 0;font-size:14px}
.k{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;margin-top:12px}
.k:first-child{margin-top:0}

/* process */
.stage .n{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700}
.stage h3{margin:4px 0 6px}
.stage p{font-size:14px;color:var(--muted)}

/* patterns */
details.pat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 18px}
details.pat+details.pat{margin-top:10px}
details.pat summary{cursor:pointer;list-style:none;padding:14px 0;display:flex;gap:10px;align-items:baseline}
details.pat summary::-webkit-details-marker{display:none}
details.pat summary:before{content:"+";font-family:var(--mono);color:var(--faint);width:12px}
details.pat[open] summary:before{content:"\2212"}
details.pat summary span{color:var(--muted);font-size:13.5px}
details.pat .body{padding:0 0 16px 22px}
details.pat .body p{font-size:14px}
.repo{margin-top:12px;font-size:13px;background:var(--bg);border:1px dashed var(--line-2);border-radius:8px;padding:7px 10px}
.repo:before{content:"En este repo · ";color:var(--faint)}

/* speaking */
.steps{list-style:none;margin:0;padding:0}
.steps li{position:relative;padding:0 0 14px 34px}
.steps li:before{content:attr(data-n);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);font-size:11px;font-weight:600;display:grid;place-items:center;color:var(--muted)}
.steps b{display:block;font-size:14px}
.steps span{display:block;font-size:13.5px;color:var(--muted)}
.quote{border-left:3px solid var(--accent);padding:6px 12px;margin:8px 0;font-size:14px;background:var(--accent-soft);border-radius:0 8px 8px 0}

/* simulator */
.launch{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin-bottom:18px}
.launch form{margin:0;display:flex;flex-direction:column;gap:8px;height:100%}
.launch p{font-size:13.5px;color:var(--muted);flex:1}
.brief{white-space:pre-wrap;font-size:14.5px}
.ask{white-space:pre-wrap;font-size:14.5px;background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-top:6px}
.qa{border-top:1px solid var(--line);padding:10px 0}
.qa:first-child{border-top:0}
.qa .q{font-weight:500;font-size:14px;white-space:pre-wrap}
.qa .a{font-size:14px;color:var(--muted);white-space:pre-wrap;margin-top:3px}
textarea{width:100%;font:inherit;font-size:14.5px;color:var(--text);background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;resize:vertical}
textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
.formrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.hint{font-size:12.5px;color:var(--faint)}
.answer{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:10px;padding:10px 12px;max-height:340px;overflow:auto}
.scores{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.score{display:grid;grid-template-columns:minmax(120px,190px) 1fr 34px;gap:10px;align-items:center;font-size:13.5px}
.bar{height:10px;background:var(--idle-soft);border-radius:5px;overflow:hidden}
.fill{height:100%;border-radius:5px}
.verdict{font-size:15px;padding:12px 14px;border-radius:12px;background:var(--accent-soft)}
.list-bad li::marker{color:var(--bad)}.list-ok li::marker{color:var(--ok)}.list-warn li::marker{color:var(--warn)}

.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.hist tr:last-child td{border-bottom:0}
.hist tr.sel td{background:var(--accent-soft)}
.tablewrap{overflow-x:auto}
.r{text-align:right;white-space:nowrap}

.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--faint);margin-top:26px}
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>Preparación · Automation Engineer</h1>
        <p class="sub" id="source"></p>
      </div>
    </div>
    <a class="btn small" href="/webhook/creator-program/dashboard">Volver al dashboard</a>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>

  <div class="flash" id="flash" role="status" hidden></div>
  <div class="flash warn" id="sample" hidden>Vista previa con datos inventados. Abierta desde n8n, el simulador llama a Claude y guarda tu progreso.</div>

  <main id="view"></main>

  <footer class="foot" id="foot"></footer>
</div>

<script>const STATE = /*__STATE__*/null;</script>
<script>
(function () {
  'use strict';

  // Same rules as the dashboard: the data arrives embedded in the page, there
  // is no fetch (n8n serves webhook HTML with an opaque origin), actions are
  // plain form posts, and page state lives in the URL hash because
  // localStorage throws in a sandboxed page.
  //
  // Everything the model writes is untrusted, so text only ever goes in
  // through textContent.

  var ACTION_URL = '/webhook/creator-program/prep/action';
  var S = STATE || sample();
  var isSample = !STATE;
  var attempts = S.attempts || [];

  var dayFmt = new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

  var KIND = {
    decomposition: ['Descomposición de producto', 'p-acc'],
    screening: ['Screening conductual', 'p-warn'],
    patterns: ['Escenario de fiabilidad', 'p-ok']
  };

  var SCORE_LABEL = {
    clarifying: 'Preguntas de aclaración',
    user_focus: 'Usuario antes que arquitectura',
    scope: 'Alcance del V1',
    design: 'Diseño',
    failure_handling: 'Fallos y verificación',
    communication: 'Comunicación'
  };

  // ---- helpers ---------------------------------------------------------------

  function h(tag, props) {
    var e = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null) return;
      if (k === 'text') e.textContent = String(v);
      else if (k === 'class') e.className = v;
      else e.setAttribute(k, String(v));
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
    }
    return e;
  }

  function list(items, cls) {
    var ul = h('ul', { class: 'plain ' + (cls || '') });
    (items || []).forEach(function (t) { ul.appendChild(h('li', { text: t })); });
    return ul;
  }

  function uuid() {
    var b = new Uint8Array(16);
    crypto.getRandomValues(b);
    b[6] = (b[6] & 15) | 64;
    b[8] = (b[8] & 63) | 128;
    var x = Array.prototype.map.call(b, function (v) { return (v + 256).toString(16).slice(1); }).join('');
    return x.slice(0, 8) + '-' + x.slice(8, 12) + '-' + x.slice(12, 16) + '-' + x.slice(16, 20) + '-' + x.slice(20);
  }

  function avgScore(a) {
    var s = a.feedback && a.feedback.scores;
    if (!s) return null;
    var keys = Object.keys(SCORE_LABEL);
    return keys.reduce(function (t, k) { return t + Number(s[k] || 0); }, 0) / keys.length;
  }

  // ---- hash state ---------------------------------------------------------------

  function readHash() { return new URLSearchParams(location.hash.slice(1)); }
  var hp = readHash();
  var tab = hp.get('t') || (hp.get('a') || hp.get('f') ? 'sim' : 'process');
  var selected = hp.get('a') || (attempts[0] && attempts[0].id) || '';
  var flashKey = hp.get('f');

  function writeHash() {
    var p = new URLSearchParams();
    p.set('t', tab);
    if (selected) p.set('a', selected);
    history.replaceState(null, '', '#' + p.toString());
  }

  // ---- forms --------------------------------------------------------------------
  // Each form carries the token only this rendered page knows. Waiting for
  // Claude takes a while, so the button says so and cannot be pressed twice.

  function actionForm(fields, label, cls, busy) {
    var f = h('form', { method: 'post', action: ACTION_URL });
    fields.token = S.action_token || '';
    Object.keys(fields).forEach(function (k) {
      f.appendChild(h('input', { type: 'hidden', name: k, value: fields[k] }));
    });
    var b = h('button', { type: 'submit', class: 'btn ' + (cls || ''), text: label });
    if (isSample) { b.disabled = true; b.title = 'No disponible en la vista previa'; }
    f.addEventListener('submit', function () {
      Array.prototype.forEach.call(document.querySelectorAll('button[type=submit]'), function (x) { x.disabled = true; });
      b.textContent = busy || 'Claude está pensando…';
    });
    return { form: f, button: b };
  }

  // ---- 1. the process -----------------------------------------------------------

  function viewProcess() {
    var stages = [
      ['01', 'Screening', 'Primero con un agente de voz de ElevenLabs y después 30 minutos con recruiter: trayectoria, interés por el audio con IA y capacidad de trabajar con autonomía en remoto.'],
      ['02', 'Prueba de código', 'Asíncrona, de 60 a 90 minutos en CoderPad, con dos problemas de dificultad media tipo LeetCode.'],
      ['03', 'Coding práctico', 'En vivo. No solo algoritmos: depurar o extender código real, explicando mientras lo haces.'],
      ['04', 'Descomposición de producto', 'Un flujo manual y desordenado (piensa en una hoja de cálculo de doblaje) que diseñas de extremo a extremo: UI, API y backend. Mitad ingeniería, mitad producto.']
    ];
    var grid = h('div', { class: 'grid2' });
    stages.forEach(function (s) {
      grid.appendChild(h('div', { class: 'card stage' },
        h('div', { class: 'n', text: s[0] }), h('h3', { text: s[1] }), h('p', { text: s[2] })));
    });

    return h('div', {},
      h('div', { class: 'section-head' }, h('h2', { text: 'El proceso' }),
        h('p', { text: 'Suele durar de 3 a 4 semanas. Automation Engineer está entre los roles con entrevista más exigente de la empresa.' })),
      grid,
      h('div', { class: 'grid2', style: 'margin-top:14px' },
        h('div', { class: 'card' },
          h('h3', { text: 'Lo que valoran' }),
          list([
            'Simplicidad frente a over engineering: la solución más pequeña que resuelve el problema.',
            'Ownership: no hay product managers, el ingeniero decide y responde del resultado.',
            'Pensar en el usuario final antes que en la arquitectura.',
            'Contar el razonamiento en voz alta y preguntar pronto.',
            'Proyectos propios construidos y lanzados, no solo tareas asignadas.',
            'Entusiasmo real por lo que construyen en voz e IA.'
          ], 'list-ok')),
        h('div', { class: 'card' },
          h('h3', { text: 'Tus huecos a trabajar' }),
          list([
            'Fiabilidad específica de LLMs: un modelo falla devolviendo algo plausible y equivocado, no con un 503.',
            'Empezar por el usuario y la UI, no por la cola. Tu instinto natural es empezar por la cola.',
            'Estructura al hablar: buenas decisiones que el entrevistador no puede seguir no puntúan.'
          ], 'list-warn'),
          h('p', { class: 'hint', style: 'margin-top:10px', text: 'Tu mejor material: este mismo repo. Idempotencia por clave natural, reintentos que distinguen transitorio de permanente, DLQ con replay y observabilidad en tres capas.' })))
    );
  }

  // ---- 2. patterns --------------------------------------------------------------

  var PATTERNS = [
    { t: 'Idempotencia', s: 'reintentar no duplica efectos',
      what: 'Ejecutar la misma operación dos veces deja el sistema igual que ejecutarla una.',
      why: 'Todo lo que reintenta (colas, webhooks, n8n, un operador nervioso) acaba ejecutando algo dos veces. Sin idempotencia eso son dos emails, dos cobros o dos filas.',
      ex: 'Clave estable derivada de la entrada (event_id, order_id) guardada con una restricción UNIQUE. La primera vez se procesa; la segunda, INSERT ... ON CONFLICT DO NOTHING. Hacia fuera, se manda una idempotency key al proveedor.',
      verify: ['Test que ejecuta el mismo paso dos veces y comprueba que hay una sola fila y un solo envío.', 'Consulta periódica de duplicados por clave natural: debe devolver cero.'],
      repo: 'UNIQUE(external_id) con INSERT OR IGNORE en screen, y el código de seguimiento como sha1 del id de la solicitud: sale igual en cada reintento.' },
    { t: 'Reintentos con backoff y jitter', s: 'solo lo transitorio se reintenta',
      what: 'Reintentar tras esperas crecientes (1 s, 2 s, 4 s...) con una parte aleatoria, y con un tope de intentos.',
      why: 'Un 503 o un timeout suelen resolverse solos. Un 400 no: reintentarlo desperdicia intentos y retrasa la alerta. Sin jitter, todo lo que falló a la vez reintenta a la vez y vuelve a tumbar al proveedor.',
      ex: 'Clasificar el error: timeout, 429 y 5xx son transitorios; validación y 404 son permanentes y van directos a la DLQ. Guardar attempts y next_attempt_at en la tarea para que la espera sobreviva a un reinicio.',
      verify: ['Proveedor falso que falla un porcentaje de llamadas a propósito.', 'Test que comprueba que un error permanente no se reintenta nunca.'],
      repo: 'TransientError y PermanentError en retry.py, y la clasificación en un único sitio, runner.py. PLATFORM_FAILURE_RATE=0.25 hace que el camino de reintentos se ejecute en cada demo.' },
    { t: 'Dead letter queue', s: 'un fallo que se puede reprocesar',
      what: 'Donde va lo que agotó sus intentos o no puede procesarse, con todo lo necesario para volver a lanzarlo.',
      why: 'Sin ella los fallos desaparecen en logs que nadie lee. Si reprocesar exige editar la base de datos a mano, la automatización es trabajo manual disfrazado.',
      ex: 'Tabla con payload, error, motivo (invalid, exhausted, crashed), enlace a la ejecución y replayed_at. Un comando o botón para relanzar, que se niega a relanzar dos veces.',
      verify: ['Alerta cuando crece la DLQ, no por cada fila.', 'Métrica de antigüedad del elemento más viejo sin resolver.'],
      repo: 'dead_letters con replay, y en n8n el índice único que evita que un registro roto se convierta en 32 filas en una semana.' },
    { t: 'Orquestación y coreografía', s: 'quién sabe el orden de los pasos',
      what: 'Orquestación: un coordinador central llama a cada paso en orden. Coreografía: cada paso emite un evento y otros reaccionan.',
      why: 'La orquestación es fácil de seguir y depurar, pero el coordinador lo conoce todo. La coreografía desacopla, pero nadie ve el flujo completo sin buena trazabilidad.',
      ex: 'Para un flujo de 5 pasos de un solo equipo, orquestación (un workflow de n8n, Temporal). Coreografía cuando varios equipos o sistemas reaccionan al mismo evento, por ejemplo "creador aceptado".',
      verify: ['Poder responder con una consulta: dónde está ahora mismo el elemento X.', 'Un id de correlación que atraviesa todos los pasos.'],
      repo: 'Pasos que nunca se importan entre sí y solo encolan el siguiente tipo de tarea. Reordenar el pipeline es configuración, no reescritura.' },
    { t: 'Observabilidad', s: 'saber que funciona sin mirarlo',
      what: 'Logs estructurados, métricas y trazabilidad de cada ejecución.',
      why: 'La pregunta en producción no es "falla" sino "desde cuándo, cuánto y a quién afecta". Con texto libre en logs eso es arqueología.',
      ex: 'Un objeto JSON por línea con task_id, kind, status y duration_ms. Una tabla de ejecuciones append only. Un resumen de 8 líneas: qué corrió, cómo acabó, cuánto tardó y cuánto espera a una persona.',
      verify: ['Consultar "fallos por paso en las últimas 24 h" en menos de un minuto.', 'Una alerta por ejecución, no una por elemento: la fatiga de alertas hace que se ignoren las reales.'],
      repo: 'obs.py, la tabla runs y el comando stats.' },
    { t: 'Validación en cada frontera', s: 'los datos malos se paran al entrar',
      what: 'Validar la entrada y la salida de cada paso contra un esquema y reglas de negocio antes de escribir nada.',
      why: 'Un dato malo parado en la entrada cuesta una línea de log. El mismo dato en la tabla de pagos cuesta una transferencia a la persona equivocada.',
      ex: 'Modelo pydantic o zod en la entrada. Umbrales de sentido común además del tipo: un post con mil millones de visitas es tipo válido y dato imposible.',
      verify: ['Tests con entradas rotas conocidas.', 'Contador de rechazados por motivo: un salto repentino indica que el proveedor cambió algo.'],
      repo: 'models.py y el tope de visitas en PostIn, porque las visitas alimentan el pago directamente.' },
    { t: 'Diseño para fallos parciales', s: 'qué pasa si falla el paso 3 de 5',
      what: 'Decidir para cada paso qué ocurre si falla después de que los anteriores ya tuvieron efecto.',
      why: 'El caso difícil no es que todo falle, sino que la mitad funcione. Un email enviado para un usuario que no existe en la base de datos es peor que no enviar nada.',
      ex: 'Ordenar los pasos para que el efecto irreversible vaya al final: primero crear la ficha, después enviar el email. Si hace falta atomicidad con un sistema externo, patrón outbox: se escribe la intención en la misma transacción y otro proceso la envía.',
      verify: ['Test que mata el proceso entre dos pasos y relanza: el resultado final debe ser correcto.', 'Revisar que cada paso sea idempotente, porque el relanzado repetirá los anteriores.'],
      repo: 'El orden deliberado dentro de onboard: crear y luego enviar.' },
    { t: 'Salidas de LLM como entrada no confiable', s: 'plausible no es correcto',
      what: 'Tratar la respuesta del modelo como la de un proveedor externo que puede devolver basura: esquema, reglas y umbral de confianza antes de actuar.',
      why: 'Un LLM que clasifica mal no lanza excepción. El pipeline marca ok y el error llega al cliente. Y si un agente reintenta a ciegas una acción, puede duplicarla: la idempotencia se impone fuera del modelo.',
      ex: 'Salida estructurada con esquema. Si no cumple, un reintento con el error en el prompt y después DLQ. Si la confianza es baja, a revisión humana. La acción final usa como clave el id del ticket, nunca algo generado por el modelo.',
      verify: ['Golden dataset: 100 casos etiquetados a mano que se pasan antes de cada cambio de prompt o de modelo.', 'Muestreo manual semanal de lo automatizado con alta confianza.', 'Porcentaje enviado a revisión humana por día: si se dispara, algo cambió aunque nada haya fallado.'],
      repo: 'Este mismo simulador: Check the reply valida la respuesta de Claude y no guarda nada que no tenga la forma esperada.' },
    { t: 'Circuit breaker', s: 'parar antes de hacer daño a escala',
      what: 'Un interruptor que detiene la automatización cuando la tasa de error supera un umbral. Cerrado, abierto y semiabierto.',
      why: 'Los reintentos protegen una tarea; el breaker protege el sistema y a tus clientes. Con un proveedor caído, sin breaker llenas la DLQ con miles de tareas. Con un prompt roto, respondes mal a miles de clientes.',
      ex: 'Más del 50 % de fallos con al menos 20 intentos en 5 minutos abre el circuito: las tareas quedan pendientes, no van a la DLQ, y sale una alerta. A los 2 minutos pasa una tarea de prueba; si va bien, se cierra.',
      verify: ['Test con el proveedor fallando al 100 %: las llamadas reales se detienen en el umbral.', 'Alerta cuando se abre y otra si lleva abierto demasiado tiempo.'],
      repo: 'Aún no existe. Buena pregunta para practicar: dónde lo pondrías, por paso, por proveedor o global.' },
    { t: 'Verificar que una automatización sale bien', s: 'la mitad que nadie prueba',
      what: 'Combinar tests, monitorización activa, revisión de muestras, comparación con casos conocidos y frenos automáticos.',
      why: 'El camino de fallo solo se ejecuta cuando algo se rompe, así que es la parte con más probabilidad de estar rota sin que nadie lo sepa.',
      ex: 'Tests unitarios de la aritmética delicada, de integración contra proveedores falsos que fallan a propósito y end to end con la demo. Freno de sanidad: si el total del mes es 3 veces el anterior, se retiene y se avisa.',
      verify: ['CI que ejecuta tests y demo en cada push.', 'Una restauración de backup probada al menos una vez: un backup nunca restaurado es una hipótesis.'],
      repo: '78 tests con peso en pagos y fallos, la demo en CI y el freno de 02 payout.' }
  ];

  function viewPatterns() {
    var box = h('div', {},
      h('div', { class: 'section-head' }, h('h2', { text: 'Patrones' }),
        h('p', { text: 'Cada patrón: qué es, por qué importa, un ejemplo corto y cómo lo verificarías. Ábrelos de uno en uno y explícalos en voz alta antes de leer.' })));
    PATTERNS.forEach(function (p) {
      var body = h('div', { class: 'body' },
        h('div', { class: 'k', text: 'Qué es' }), h('p', { text: p.what }),
        h('div', { class: 'k', text: 'Por qué importa' }), h('p', { text: p.why }),
        h('div', { class: 'k', text: 'Ejemplo' }), h('p', { text: p.ex }),
        h('div', { class: 'k', text: 'Cómo lo verificarías' }), list(p.verify),
        h('div', { class: 'repo', text: p.repo }));
      box.appendChild(h('details', { class: 'pat' }, h('summary', {}, h('b', { text: p.t }), h('span', { text: p.s })), body));
    });
    return box;
  }

  // ---- 3. speaking --------------------------------------------------------------

  function viewSpeak() {
    var steps = [
      ['Aclarar', '3 a 5 minutos. Quién lo usa, cuántos, con qué frecuencia, qué duele hoy, qué pasa si falla.'],
      ['Usuarios y flujo', '2 o 3 roles y el camino feliz de cada uno en una frase.'],
      ['Alcance del V1', 'Qué NO haces. Es lo que más valoran: simplicidad.'],
      ['UI', '2 o 3 pantallas descritas, no dibujadas con detalle.'],
      ['Modelo de datos', '3 a 5 entidades y sus estados.'],
      ['API', '4 a 6 endpoints.'],
      ['Automatización y fallos', 'Aquí brillas. Pero llega aquí, no empieces aquí.'],
      ['Cómo sabes que funciona', 'Métricas, alertas y qué revisarías a mano la primera semana.']
    ];
    var ol = h('ol', { class: 'steps' });
    steps.forEach(function (s, i) { ol.appendChild(h('li', { 'data-n': i + 1 }, h('b', { text: s[0] }), h('span', { text: s[1] }))); });

    function quote(t) { return h('div', { class: 'quote', text: t }); }

    return h('div', {},
      h('div', { class: 'section-head' }, h('h2', { text: 'Cómo contar el razonamiento' }),
        h('p', { text: 'El mismo orden en cada descomposición. Anúncialo al empezar para que el entrevistador sepa dónde estás en todo momento.' })),
      h('div', { class: 'grid2' },
        h('div', { class: 'card' }, h('h3', { text: 'El orden', style: 'margin-bottom:10px' }), ol),
        h('div', {},
          h('div', { class: 'card' },
            h('h3', { text: 'Para empezar' }),
            quote('Voy a ir de usuario a infraestructura. Paro en cada punto por si quieres que profundice.')),
          h('div', { class: 'card' },
            h('h3', { text: 'Cuando te bloqueas' }),
            quote('Voy a asumir X para avanzar, dime si no es así.'),
            quote('Aquí hay dos opciones. Elijo la más simple porque...'),
            quote('Esto lo dejaría fuera del V1. Lo haría cuando pase Y.')),
          h('div', { class: 'card' },
            h('h3', { text: 'Errores típicos' }),
            list([
              'Diseñar antes de preguntar nada.',
              'Empezar por la cola o el workflow en vez de por quién lo usa.',
              'Un V1 con todo: permisos finos, multi idioma, analítica, IA en cada paso.',
              'Hablar de herramientas (n8n, Kafka) en vez de decisiones y sus motivos.',
              'No decir nunca cómo sabrías que funciona.'
            ], 'list-bad'))))
    );
  }

  // ---- 4. simulator ---------------------------------------------------------------

  function viewSim() {
    var box = h('div', {});
    box.appendChild(h('div', { class: 'section-head' }, h('h2', { text: 'Simulador' }),
      h('p', { text: 'Pide un caso, haz preguntas al cliente como en la entrevista real y envía tu respuesta. Claude la evalúa como un entrevistador exigente. Todo queda guardado en el historial.' })));

    var launch = h('div', { class: 'launch' });
    [
      ['decomposition', 'Un proceso manual y desordenado que diseñas de extremo a extremo. Pregunta antes de diseñar.'],
      ['screening', 'Tres preguntas conductuales. Respóndelas como las dirías en voz alta, con ejemplos reales.'],
      ['patterns', 'Una automatización que falla de forma realista. Explica qué pasa, qué patrón lo arregla y cómo lo verificarías.']
    ].forEach(function (k) {
      var f = actionForm({ action: 'case', kind: k[0], id: uuid() }, 'Nuevo caso', 'primary', 'Escribiendo el caso…');
      f.form.appendChild(h('span', { class: 'pill ' + KIND[k[0]][1], text: KIND[k[0]][0] }));
      f.form.appendChild(h('p', { text: k[1] }));
      f.form.appendChild(f.button);
      launch.appendChild(h('div', { class: 'card' }, f.form));
    });
    box.appendChild(launch);

    var a = attempts.filter(function (x) { return x.id === selected; })[0];
    if (!a) {
      box.appendChild(h('div', { class: 'card' }, h('p', { class: 'empty', text: 'Aún no hay ningún caso. Empieza por una descomposición de producto: es la ronda que más te preocupa.' })));
      return box;
    }
    box.appendChild(attemptView(a));
    return box;
  }

  function attemptView(a) {
    var brief = a.brief || {};
    var transcript = a.transcript || [];
    var wrap = h('div', {});

    wrap.appendChild(h('div', { class: 'card' },
      h('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px' },
        h('span', { class: 'pill ' + (KIND[a.kind] || ['', 'p-idle'])[1], text: (KIND[a.kind] || [a.kind])[0] }),
        h('span', { class: 'hint', text: dayFmt.format(new Date(a.created_at)) })),
      h('h2', { text: a.title, style: 'margin-bottom:10px' }),
      h('div', { class: 'k', text: 'Contexto' }), h('p', { class: 'brief', text: brief.context }),
      h('div', { class: 'k', text: a.kind === 'screening' ? 'Las preguntas' : 'Lo que pide' }),
      h('p', { class: 'ask', text: brief.client_ask })));

    if (a.kind !== 'screening' && (transcript.length || !a.feedback)) {
      var qa = h('div', { class: 'card' },
        h('h3', { text: 'Preguntas al cliente' }),
        h('p', { class: 'hint', text: 'El cliente solo contesta lo que sabría. Pregunta por usuarios, volumen, herramientas actuales y qué pasa cuando algo falla.' }));
      var listBox = h('div', { style: 'margin-top:8px' });
      if (!transcript.length) listBox.appendChild(h('p', { class: 'empty', text: 'Aún no has preguntado nada.' }));
      transcript.forEach(function (x) {
        listBox.appendChild(h('div', { class: 'qa' }, h('div', { class: 'q', text: x.q }), h('div', { class: 'a', text: x.a })));
      });
      qa.appendChild(listBox);
      if (!a.feedback) {
        var f = actionForm({ action: 'ask', id: a.id, turn: String(transcript.length) }, 'Preguntar', '', 'Esperando al cliente…');
        f.form.appendChild(h('textarea', { name: 'text', rows: 2, maxlength: 2000, required: 'required', placeholder: 'Por ejemplo: ¿cuántas personas tocan hoy la hoja y con qué rol?' }));
        f.form.appendChild(h('div', { class: 'formrow' }, h('span', {}), f.button));
        qa.appendChild(f.form);
      }
      wrap.appendChild(qa);
    }

    if (!a.feedback) {
      var ans = actionForm({ action: 'answer', id: a.id }, 'Enviar y recibir feedback', 'primary', 'Evaluando tu respuesta… (hasta 1 minuto)');
      ans.form.appendChild(h('textarea', { name: 'text', rows: 16, maxlength: 20000, required: 'required',
        placeholder: a.kind === 'screening'
          ? 'Responde cada pregunta como la dirías en voz alta.'
          : 'Escríbela como si hablaras. Anuncia cada paso: usuarios, alcance del V1, UI, datos, API, automatización y fallos, cómo sabes que funciona.' }));
      ans.form.appendChild(h('div', { class: 'formrow' },
        h('span', { class: 'hint', text: 'Una sola respuesta por caso: después se corrige y queda cerrado.' }), ans.button));
      wrap.appendChild(h('div', { class: 'card' }, h('h3', { text: 'Tu respuesta', style: 'margin-bottom:8px' }), ans.form));
      return wrap;
    }

    wrap.appendChild(h('div', { class: 'card' }, h('h3', { text: 'Tu respuesta', style: 'margin-bottom:8px' }), h('div', { class: 'answer', text: a.answer })));
    wrap.appendChild(feedbackView(a));
    return wrap;
  }

  function feedbackView(a) {
    var fb = a.feedback;
    var scores = h('div', { class: 'scores' });
    Object.keys(SCORE_LABEL).forEach(function (k) {
      var v = Number((fb.scores || {})[k] || 0);
      var color = v >= 4 ? 'var(--ok)' : v === 3 ? 'var(--warn)' : 'var(--bad)';
      scores.appendChild(h('div', { class: 'score' },
        h('span', { text: SCORE_LABEL[k] }),
        h('div', { class: 'bar' }, h('div', { class: 'fill', style: 'width:' + (v * 20) + '%;background:' + color })),
        h('b', { class: 'r', text: v + '/5' })));
    });

    var avg = avgScore(a);
    var asked = (a.transcript || []).length;

    return h('div', {},
      h('div', { class: 'card' },
        h('div', { style: 'display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap' },
          h('h3', { text: 'Feedback del entrevistador' }),
          h('span', { class: 'hint', text: 'Media ' + avg.toFixed(1).replace('.', ',') + ' de 5 · ' + asked + ' preguntas hechas' })),
        h('p', { class: 'verdict', style: 'margin-top:10px', text: fb.verdict }),
        scores),
      h('div', { class: 'grid2', style: 'margin-top:14px' },
        h('div', { class: 'card' }, h('h3', { text: 'Lo que faltó' }),
          fb.missing.length ? list(fb.missing, 'list-bad') : h('p', { class: 'empty', text: 'Nada relevante.' })),
        h('div', { class: 'card' }, h('h3', { text: 'Dónde diseñaste de más' }),
          fb.overengineered.length ? list(fb.overengineered, 'list-warn') : h('p', { class: 'empty', text: 'No sobró nada.' }))),
      h('div', { class: 'grid2', style: 'margin-top:14px' },
        h('div', { class: 'card' }, h('h3', { text: 'Lo que hiciste bien' }), list(fb.strengths, 'list-ok')),
        h('div', { class: 'card' }, h('h3', { text: 'Lo que te preguntaría ahora' }), list(fb.interviewer_questions))),
      h('div', { class: 'card', style: 'margin-top:14px' },
        h('h3', { text: 'Una respuesta fuerte habría incluido' }), list(fb.model_answer),
        h('div', { class: 'k', text: 'Criterios del caso' }), list((a.brief || {}).evaluation),
        h('div', { class: 'k', text: 'Lo que sabía el cliente' }), list((a.brief || {}).hidden_facts)),
      h('div', { class: 'flash', style: 'margin-top:14px' }, h('b', { text: 'Siguiente paso: ' }), fb.next_step)
    );
  }

  // ---- 5. history -----------------------------------------------------------------

  function viewHistory() {
    var box = h('div', {}, h('div', { class: 'section-head' }, h('h2', { text: 'Historial' }),
      h('p', { text: 'Tus últimos 50 casos. La media baja cuando los casos se complican: lo que importa es qué falta en cada uno.' })));
    if (!attempts.length) {
      box.appendChild(h('div', { class: 'card' }, h('p', { class: 'empty', text: 'Aún no has practicado ningún caso.' })));
      return box;
    }

    var graded = attempts.filter(function (x) { return x.feedback; });
    if (graded.length) {
      var sums = {};
      Object.keys(SCORE_LABEL).forEach(function (k) {
        sums[k] = graded.reduce(function (t, x) { return t + Number(x.feedback.scores[k] || 0); }, 0) / graded.length;
      });
      var weakest = Object.keys(sums).sort(function (x, y) { return sums[x] - sums[y]; })[0];
      box.appendChild(h('div', { class: 'flash' },
        graded.length + (graded.length === 1 ? ' caso corregido' : ' casos corregidos') + '. Tu punto más flojo de media: ',
        h('b', { text: SCORE_LABEL[weakest] + ' (' + sums[weakest].toFixed(1).replace('.', ',') + ')' }), '.'));
    }

    var tbody = h('tbody');
    attempts.forEach(function (x) {
      var avg = avgScore(x);
      var link = h('a', { href: '#', text: x.title });
      link.addEventListener('click', function (ev) { ev.preventDefault(); selected = x.id; tab = 'sim'; render(); window.scrollTo(0, 0); });
      tbody.appendChild(h('tr', { class: x.id === selected ? 'sel' : '' },
        h('td', {}, link, h('div', { class: 'hint', text: (KIND[x.kind] || [x.kind])[0] })),
        h('td', { class: 'r hint', text: dayFmt.format(new Date(x.created_at)) }),
        h('td', { class: 'r' }, avg == null
          ? h('span', { class: 'pill p-idle', text: 'sin responder' })
          : h('span', { class: 'pill ' + (avg >= 4 ? 'p-ok' : avg >= 3 ? 'p-warn' : 'p-bad'), text: avg.toFixed(1).replace('.', ',') + ' / 5' }))));
    });
    box.appendChild(h('div', { class: 'card tablewrap' }, h('table', { class: 'hist' }, tbody)));
    return box;
  }

  // ---- shell ------------------------------------------------------------------------

  var TABS = [
    ['process', 'El proceso', viewProcess],
    ['patterns', 'Patrones', viewPatterns],
    ['speak', 'Cómo hablar', viewSpeak],
    ['sim', 'Simulador', viewSim],
    ['history', 'Historial', viewHistory]
  ];

  function render() {
    var nav = document.getElementById('tabs');
    nav.textContent = '';
    TABS.forEach(function (t) {
      var b = h('button', { type: 'button', class: 'tab', role: 'tab', 'aria-selected': t[0] === tab ? 'true' : 'false', text: t[1] });
      b.addEventListener('click', function () { tab = t[0]; render(); });
      nav.appendChild(b);
    });
    var current = TABS.filter(function (t) { return t[0] === tab; })[0] || TABS[0];
    var view = document.getElementById('view');
    view.textContent = '';
    view.appendChild(current[2]());
    writeHash();
  }

  var FLASH = {
    case: ['Caso listo. Lee el contexto y empieza preguntando.', ''],
    ask: ['El cliente ha respondido.', ''],
    answer: ['Feedback listo.', ''],
    denied: ['Acción rechazada: el token no coincide. Recarga la página y vuelve a intentarlo.', 'bad'],
    invalid: ['La petición no era válida. Recarga la página y vuelve a intentarlo.', 'bad'],
    too_long: ['El texto es demasiado largo: el máximo son 20.000 caracteres.', 'bad'],
    model_error: ['Claude no respondió tras 3 intentos. Revisa la credencial «anthropic api key» en n8n y vuelve a intentarlo.', 'bad'],
    bad_reply: ['La respuesta de Claude no pasó la validación y no se ha guardado nada. Vuelve a intentarlo.', 'bad'],
    refused: ['Claude rechazó la petición. Reformula el texto y vuelve a intentarlo.', 'bad']
  };

  function renderFlash() {
    var f = FLASH[flashKey];
    if (!f) return;
    var el = document.getElementById('flash');
    el.textContent = f[0];
    if (f[1]) el.classList.add(f[1]);
    el.hidden = false;
  }

  // ---- sample data, only when the file is opened directly ---------------------------

            hidden_facts: ['Unas 60 personas tocan la hoja.', 'Hay 3 roles.', 'Unos 2.000 episodios activos.'],

        },
        {
          id: '0b7d4c1a-2e3f-4a5b-8c6d-7e8f9a0b1c2d', kind: 'patterns', model: 'claude-opus-5',
          title: 'Emails de bienvenida duplicados', created_at: t(30), answered_at: t(29),
          brief: {

            hidden_facts: ['El nodo de email tiene 3 reintentos.', 'El proveedor devolvió timeout pero sí envió.'],
            evaluation: ['Identifica el timeout con efecto.', 'Propone idempotency key.', 'Propone cómo verificarlo.']
          },
          transcript: [],
          answer: 'El proveedor tardó más que el timeout pero envió el email, y n8n reintentó...',
          feedback: {
            verdict: 'Diagnóstico correcto y rápido. Falta explicar cómo verificarías el arreglo y qué harías con los 300 clientes afectados.',
            scores: { clarifying: 2, user_focus: 3, scope: 4, design: 4, failure_handling: 4, communication: 3 },
            strengths: ['Identificas el timeout con efecto como causa.', 'Propones una idempotency key estable.'],
            missing: ['No preguntas si el proveedor acepta idempotency keys.', 'No dices cómo lo verificarías.'],
            overengineered: [],
            interviewer_questions: ['¿Y si el proveedor no acepta idempotency keys?', '¿Qué les dices a los 300 clientes?'],
            model_answer: ['Timeout no significa fallo.', 'Clave de idempotencia derivada del cliente.', 'Registro de envíos con UNIQUE.', 'Test que simula timeout con envío.'],
            next_step: 'Termina cada respuesta con una frase sobre cómo sabrías que funciona.',
            model: 'claude-opus-5'
          }
        }
      ]
    };
  }

  // ---- go ---------------------------------------------------------------------------

  document.getElementById('sample').hidden = !isSample;
  document.getElementById('source').textContent = isSample
    ? 'Vista previa'
    : 'Tu progreso se guarda en creator_prod · simulador con ' + (S.model || 'Claude');
  document.getElementById('foot').appendChild(h('span', { text: 'Fuentes del proceso: guías públicas de Aced (Exponent), TechPrep, JobsByCulture y Glassdoor, 2026.' }));
  renderFlash();
  render();
  window.addEventListener('hashchange', function () {
    var p = readHash();
    if (p.get('t')) tab = p.get('t');
    if (p.get('a')) selected = p.get('a');
    render();
  });
})();
</script>
